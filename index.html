<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--grid:#c3cdd9;--gridh:#8fa3a0;--bg:#f3f5f9;--card:#fff;--ink:#1b2432;--mut:#667386;--line:#e3e8ef;--pri:#0f766e;--pri-soft:#e1f4f1;--red:#dc2626;--red-soft:#fde8e8;--amb:#b45309;--amb-soft:#fef3c7;--blue:#2563eb;--blue-soft:#e3ecfd;--vio:#7c3aed;--vio-soft:#efe7fd;--gr:#15803d;--gr-soft:#dcf5e4;--side:#0f1b2d;--shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.05)}
:root[data-theme=dark]{--grid:#34445f;--gridh:#4d6a69;--bg:#0b1220;--card:#121b2e;--ink:#e6ebf3;--mut:#93a0b4;--line:#22304a;--pri:#2dd4bf;--pri-soft:#10312f;--red:#f87171;--red-soft:#3a1c1c;--amb:#fbbf24;--amb-soft:#3a2e10;--blue:#60a5fa;--blue-soft:#16284a;--vio:#a78bfa;--vio-soft:#2a2150;--gr:#4ade80;--gr-soft:#133322;--side:#08101d;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px 1fr;height:100vh}
#side{background:var(--side);color:#c9d3e3;display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;color:#fff}
.brand i{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#14b8a6,#2563eb);display:grid;place-items:center;font-style:normal;font-weight:700}
.brand b{display:block;font-size:14px;line-height:1.2}.brand small{color:#8ea0bb;font-size:11px}
.nav-h{font-size:11px;letter-spacing:.08em;color:#6f819d;padding:12px 10px 4px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:rgba(20,184,166,.18);color:#5eead4;font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:#8ea0bb;padding:10px;word-break:break-all}
#main{display:flex;flex-direction:column;min-width:0;height:100vh}
#top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
#top .grow{flex:1;min-width:160px;position:relative}
#top .grow input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#top .grow svg{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
:root[data-theme=dark] .btn.pri{color:#04201d}
.btn.sm{padding:3px 9px;font-size:12px}.btn.red{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:default}
select,input[type=text],input[type=date],input[type=number],textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;width:100%}
select{width:auto;max-width:100%}
textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 45%,transparent);border-color:var(--pri)}
#burger{display:none}
.view{display:none;flex:1;overflow:auto;padding:18px}#v-list{padding:10px 14px 8px}#v-list.on{display:flex;flex-direction:column;overflow:hidden}#v-list .tw{flex:1;min-height:0;max-height:none}#v-list .pager{margin-top:6px;flex-shrink:0}#v-list>.bar,#v-list>.mut{flex-shrink:0}.view.on{display:block}
.h1{font-size:18px;font-weight:700;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme=dark] .chip.on{color:#04201d}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi b{font-size:24px;line-height:1.1;display:block}.kpi span{color:var(--mut);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.cv{position:relative;height:250px}
.lst{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.li:hover{border-color:var(--pri)}.li b{font-weight:600}.li small{color:var(--mut);display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar select,.bar input[type=date]{padding:6px 8px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:calc(100vh - 290px)}
table{border-collapse:collapse;width:100%;min-width:1000px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.rw{cursor:pointer}tr.rw:hover td{background:color-mix(in srgb,var(--pri) 6%,transparent)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mut{color:var(--mut);font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-gr{background:var(--gr-soft);color:var(--gr)}.b-bl{background:var(--blue-soft);color:var(--blue)}.b-am{background:var(--amb-soft);color:var(--amb)}.b-rd{background:var(--red-soft);color:var(--red)}.b-vi{background:var(--vio-soft);color:var(--vio)}.b-mu{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
#ov{position:fixed;inset:0;background:rgba(10,18,30,.45);display:none;z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--card);border-left:1px solid var(--line);transform:translateX(105%);transition:.22s;z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
#drawer.on{transform:none}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{margin:0;font-size:16px;flex:1}.db{padding:16px 18px;overflow:auto;flex:1}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.fg .full{grid-column:1/-1}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin-bottom:12px}.kv dt{color:var(--mut);font-size:12.5px}.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.warn{background:var(--amb-soft);color:var(--amb);border-radius:9px;padding:8px 11px;font-size:13px;margin-bottom:10px}
details{border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:10px}summary{cursor:pointer;font-weight:600;font-size:13px}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}#busy.on{opacity:1}#busy::before{content:"";position:absolute;top:0;height:100%;width:30%;background:var(--pri);animation:bz 1.1s ease-in-out infinite}@keyframes bz{0%{left:-30%}100%{left:100%}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;align-items:center}
.tt{background:#1b2432;color:#fff;padding:9px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:13.5px;max-width:90vw}.tt.err{background:#b91c1c}.tt.ok{background:#0f766e}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,18,30,.5);z-index:80;padding:16px}
#modal .box{background:var(--card);border-radius:14px;padding:18px 20px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.fr{width:100%;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:12px;background:#fff}
.prog{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:0;background:var(--pri);transition:.2s}
.empty{padding:40px;text-align:center;color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:860px){#app{grid-template-columns:1fr}#side{position:fixed;z-index:50;left:0;top:0;bottom:0;width:230px;transform:translateX(-105%);transition:.2s}#side.on{transform:none}#burger{display:inline-block}.view{padding:12px}.fg{grid-template-columns:1fr}.kv{grid-template-columns:100px 1fr}}
.xl{table-layout:fixed;font-size:12.5px;border-collapse:separate;border-spacing:0}
.xl th,.xl td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:4px 6px;white-space:pre-wrap;word-break:break-word;vertical-align:top;line-height:1.35}
.xl thead{position:sticky;top:0;z-index:3}
.xl th{position:static;text-transform:none;letter-spacing:0;text-align:center;vertical-align:middle;font-weight:700;color:var(--txt,inherit);background:color-mix(in srgb,var(--pri) 14%,var(--card));background-clip:padding-box}
.xl thead th{border-right:1px solid var(--gridh);border-bottom:1px solid var(--gridh)}
.xl thead tr.n th{font-weight:400;font-size:11px;color:var(--mut);padding:1px}
.xl tr.bn td{background:color-mix(in srgb,var(--pri) 20%,var(--card));font-weight:700;text-align:left;cursor:default;border-right:0}
.xl tr.bn td span{position:sticky;left:12px;display:inline-block}
.xl td.c{text-align:center}.xl td.x{font-weight:700}.xl td.x.k{color:var(--pri)}
.xl .e{white-space:pre-wrap;max-height:150px;overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--card);color:inherit;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}.seg button.on{background:var(--pri);color:#fff}

#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-items:center;padding:16px;overflow:auto}
#login .lb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 26px 20px;width:min(400px,100%);box-shadow:0 20px 60px rgba(0,0,0,.2)}
#login h2{margin:0 0 4px}#login .f{margin-bottom:11px}#login a{color:var(--pri);cursor:pointer;font-size:13px}
.rolebadge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--pri);color:#fff;margin-left:4px}
.side-foot{line-height:1.5}.side-foot .lk{display:flex;gap:10px;margin-top:4px}.side-foot a{cursor:pointer;color:var(--pri);font-size:12px}
.hid{display:none!important}
.tbl{width:100%;min-width:560px;border-collapse:collapse}.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;position:static;text-transform:none;letter-spacing:0;font-size:13px;cursor:default}
.cols{display:grid;grid-template-columns:auto 26px minmax(120px,1fr) 70px 130px;gap:6px 8px;align-items:center;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px}
.cols input[type=text]{padding:5px 8px}
</style>

var RX_DATE=/(\d{1,2})\s*[\/.\-,]\s*(\d{1,2})\s*[\/.\-,]\s*(\d{4})/;
function normRow(a){
  var r={row:a[0],A:a[1],B:a[2],C:a[3],D:a[4],E:a[5],F:a[6],G:a[7],H:a[8],I:a[9],J:a[10],K:a[11],L:a[12],M:a[13],N:a[14],O:a[15],P:a[16],Q:a[17],R:a[18],S:a[19],ban:a[20]||'',ed:a[21]===undefined?1:a[21]};
  var m=String(r.A).match(/^\s*(\d+)/);r.stt=m?Number(m[1]):0;
  var bl=String(r.B).split('\n');r.soden=(bl.length>1&&/^\s*\d+\s*$/.test(bl[0]))?bl[0].trim():'';
  var d=String(r.B).match(RX_DATE);r.date=d?d[3]+'-'+pad(+d[2])+'-'+pad(+d[1]):'';
  if(r.date&&(+d[2]>12||+d[2]<1)){r.date=''}
  var cl=String(r.C).split('\n'),nm=cl[0],ad=cl.slice(1).join(', ');
  var x=nm.match(/^(.*?)[,;]?\s*(?:địa chỉ|đc|đ\/c)\s*:\s*(.*)$/i);
  if(!ad&&x){nm=x[1];ad=x[2]}
  r.name=nm.trim();r.addr=ad.replace(/^\s*(đc|địa chỉ|đ\/c)\s*:?\s*/i,'').trim();
  r.month=r.date?r.date.slice(0,7):'';
  r.who=String(r.R).trim();r.src=String(r.D).trim();r.loai=String(r.F).replace(/\s+/g,' ').trim();
  r.huong=huongOf(r);
  r.noi=[r.J,r.K,r.L,r.M,r.N,r.Q].map(function(v){return String(v).trim()}).filter(function(v){return v&&!/^(tbcd|xl)$/i.test(v)}).join(' • ');
  r.done=(r.huong!=='Chưa phân loại')||!!String(r.S).trim();
  r.hay=noacc([r.A,r.B,r.C,r.D,r.E,r.F,r.J,r.K,r.L,r.M,r.N,r.O,r.P,r.Q,r.R,r.S].join(' '));
  return r;
}
function huongOf(r){
  var q=noacc(r.Q),pq=noacc(r.P+' '+r.Q),k=noacc(r.K).trim(),l=noacc(r.L).trim(),m=noacc(r.M).trim(),j=noacc(r.J).trim();
  if(/tbcd|tra lai|huong dan/.test(pq))return 'Trả lại đơn, hướng dẫn';
  if(String(r.O).trim()||/^xl\b|xep luu|luu don/.test(q)||/xep luu/.test(j))return 'Xếp lưu';
  if(k)return 'Chuyển CQĐT';
  if(m||/^(ta|tand|toa)/.test(l))return 'Chuyển Tòa án';
  if(l)return 'Chuyển VKS';
  if(String(r.N).trim()||q.trim())return 'Chuyển cơ quan khác';
  if(j)return 'Phòng nghiệp vụ';
  return 'Chưa phân loại';
}

function inPeriod(r){
  if(S.period==='all')return true;if(!r.date)return false;
  var t=todayISO(),y=t.slice(0,4),mo=t.slice(0,7);
  if(S.period==='year')return r.date.slice(0,4)===y;
  if(S.period==='month')return r.month===mo;
  if(S.period==='q'){var qn=Math.floor((+t.slice(5,7)-1)/3);var m=+r.date.slice(5,7);return r.date.slice(0,4)===y&&Math.floor((m-1)/3)===qn}
  if(S.period==='30')return r.date>=addDays(t,-30)&&r.date<=t;
  if(S.period==='custom')return (!S.pf||r.date>=S.pf)&&(!S.pt||r.date<=S.pt);
  return true;
}

function filtered(){
  var f=S.f,qs=noacc(f.q).split(/\s+/).filter(Boolean);
  var rows=S.rows.filter(function(r){
    if(f.month&&r.month!==f.month)return false;if(f.who&&r.who!==f.who)return false;
    if(f.src&&r.src.replace(/\s+/g,' ').slice(0,28)!==f.src)return false;
    if(f.dv&&jKey(r)!==f.dv)return false;if(f.huong&&r.huong!==f.huong)return false;
    if(f.tt==='chua'&&r.done)return false;if(f.tt==='da'&&!r.done)return false;
    if(f.from&&(!r.date||r.date<f.from))return false;if(f.to&&(!r.date||r.date>f.to))return false;
    for(var i=0;i<qs.length;i++)if(r.hay.indexOf(qs[i])<0)return false;
    return true;
  });
  var k=S.sort.k,d=S.sort.d;
  rows.sort(function(a,b){var x,y;
    if(k==='soden'){var ma=a.date?a.date.slice(0,7):'',mb=b.date?b.date.slice(0,7):'';if(ma!==mb)return ma<mb?-d:d;x=a.stt||0;y=b.stt||0}else if(k==='date'){x=a.date||'';y=b.date||''}else if(k==='name'){x=noacc(a.name);y=noacc(b.name)}else if(k==='who'){x=noacc(a.who);y=noacc(b.who)}else if(k==='huong'){x=a.huong;y=b.huong}else{x=a.row;y=b.row}
    return x<y?-d:x>y?d:(a.row-b.row)*d});
  return rows;
}

   +'<div style="'+h4+'">4. Phạm vi đơn được xem</div>'
   +'<div class="f"><select id="uVs"><option value="all">Xem tất cả đơn</option><option value="handler">Chỉ xem đơn do mình xử lý</option></select></div>'
   +'<div class="f" id="uHw"><label>Tên người xử lý của tài khoản này (đúng như cột “Người xử lý đơn”) — cần khi chọn phạm vi “đơn do mình xử lý”</label><input id="uH" type="text" value="'+esc(u.handler)+'" list="dlU"></div>'
   +'<div class="mut">“Đơn do mình tạo” tính từ lúc bật tính năng này: đơn tạo bằng app được ghi nhận người tạo; đơn có sẵn hoặc nhập trực tiếp trong Google Sheet chưa có người tạo (chỉ quản trị hoặc phạm vi khác mới sửa được).</div>'+'<datalist id="dlU">'+who.map(function(w){return '<option value="'+esc(w)+'">'}).join('')+'</datalist></div>'
   +'<label style="display:flex;gap:6px;align-items:center;margin-top:12px"><input type="checkbox" id="uA" '+(u.active?'checked':'')+'> Tài khoản đang hoạt động</label></div>'
   +'<div class="df"><button class="btn pri" id="uGo">'+(isNew?'Tạo tài khoản':'Lưu')+'</button><button class="btn" onclick="closeDrawer()">Huỷ</button></div>');
  $('#uR').value=u.role;$('#uVs').value=P.vscope||'all';$('#uEs').value=P.escope||'all';
  var PRE={editor:{dash:1,list:1,add:1,edit:1,export:1,phieu:1,log:0},viewer:{dash:1,list:1,add:0,edit:0,export:1,phieu:1,log:0}};
  var setPre=function(role){var p=PRE[role];if(!p)return;Object.keys(p).forEach(function(k){var c=$('[data-pk="'+k+'"]');if(c)c.checked=!!p[k]});
    $$('[data-cv]').forEach(function(c){c.checked=true});$$('[data-ce]').forEach(function(c){c.checked=role==='editor'});$$('[data-es]').forEach(function(c){c.checked=role==='editor'&&$('[data-s="'+c.dataset.es+'"]').checked});$('#uVs').value='all';$('#uEs').value='all'};
  var sync=function(){$('#uSh').classList.toggle('hid',$('#uR').value==='admin')};$('#uR').onchange=function(){setPre($('#uR').value);sync()};sync();
  // sửa ⊂ xem
  $$('[data-ce]').forEach(function(c){c.onchange=function(){if(c.checked)$('[data-cv="'+c.dataset.ce+'"]').checked=true}});
  $$('[data-cv]').forEach(function(c){c.onchange=function(){if(!c.checked)$('[data-ce="'+c.dataset.cv+'"]').checked=false}});
  $$('[data-es]').forEach(function(c){c.onchange=function(){if(c.checked)$('[data-s="'+c.dataset.es+'"]').checked=true}});
  $$('[data-s]').forEach(function(c){c.onchange=function(){if(!c.checked)$('[data-es="'+c.dataset.s+'"]').checked=false}});
  $('#cvAll').onclick=function(){$$('[data-cv]').forEach(function(c){c.checked=true})};
  $('#ceAll').onclick=function(){$$('[data-cv],[data-ce]').forEach(function(c){c.checked=true})};
  $('#ceNone').onclick=function(){$$('[data-ce]').forEach(function(c){c.checked=false})};
  $('#uGo').onclick=async function(){
    var sel=[],es=[],vc=[],ec=[],pm={};
    $$('[data-s]').forEach(function(c){if(c.checked)sel.push(sh[+c.dataset.s])});
    $$('[data-es]').forEach(function(c){if(c.checked)es.push(sh[+c.dataset.es])});
    $$('[data-cv]').forEach(function(c){if(c.checked)vc.push(c.dataset.cv)});
    $$('[data-ce]').forEach(function(c){if(c.checked)ec.push(c.dataset.ce)});
    $$('[data-pk]').forEach(function(c){pm[c.dataset.pk]=c.checked?1:0});
    pm.vcols=vc;pm.ecols=ec;pm.esheets=es;pm.vscope=$('#uVs').value;pm.escope=$('#uEs').value;
    if($('#uR').value!=='admin'&&(pm.vscope==='handler'||(pm.edit&&(pm.escope==='handler'||pm.escope==='both')))&&!$('#uH').value.trim()){toast('Hãy nhập tên người xử lý của tài khoản (đúng như cột R) để dùng phạm vi “đơn do mình xử lý”','err',7000);return}
    if($('#uR').value!=='admin'&&pm.add&&!ec.some(function(x){return x==='C'||x==='E'})){toast('Đã cho “Thêm đơn mới” thì cần cho sửa ít nhất cột C hoặc E','err',6000);return}
    var o={username:$('#uU').value,name:$('#uN').value,role:$('#uR').value,sheets:$('#uR').value==='admin'?'*':sel,perm:$('#uR').value==='admin'?null:pm,onlyOwn:pm.vscope==='handler',handler:$('#uH').value,active:$('#uA').checked,password:$('#uP').value};
    this.disabled=true;try{await run('saveUser',o,isNew);closeDrawer();toast('Đã lưu tài khoản','ok');renderUsers()}catch(e){toast(e.message,'err',7000);this.disabled=false}
  };
}

boot();
</script>
</body>
</html>
